services:
  mongo:
    image: mongo:7
    container_name: saas_mongo
    mem_limit: 1g
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval ''db.adminCommand({ ping: 1 })''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  postgis:
    image: postgis/postgis:18-3.6
    container_name: saas_postgis
    # Headroom for the ingestion sorts and index builds (it peaks around 3.5 GiB
    # while loading the CNPJ parts and goes past 4 GiB on the 50M-row Simples
    # snapshot, which killed a backend under the previous limit).
    mem_limit: 6g
    ports:
      - '5432:5432'
    volumes:
      - postgis_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-saas_geo}
      - POSTGRES_USER=${POSTGRES_USER:-saas_geo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-saas_geo}
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: saas_postgres_exporter
    mem_limit: 128m
    ports:
      - '9187:9187'
    environment:
      - DATA_SOURCE_NAME=postgres://${POSTGRES_USER:-saas_geo}:${POSTGRES_PASSWORD:-saas_geo}@postgis:5432/${POSTGRES_DB:-saas_geo}?sslmode=disable
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./infra/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:3-management
    container_name: saas_rabbitmq
    mem_limit: 512m
    ports:
      - '5672:5672'
      - '15672:15672'
      - '15692:15692'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    restart: unless-stopped
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: saas_prometheus
    mem_limit: 512m
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
      - '--storage.tsdb.wal-compression'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
  grafana:
    image: grafana/grafana:11.4.0
    container_name: saas_grafana
    mem_limit: 512m
    ports:
      - '3001:3000'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started

volumes:
  mongo_data:
  postgis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
