global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # The api port must match PORT in .env (the client uses 3000, so the api uses 9001).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9001']
  - job_name: worker-geo
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9464']
  - job_name: worker-email
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9465']
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
